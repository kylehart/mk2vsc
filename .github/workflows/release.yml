name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}
  pypi:
    # Requires the PyPI project "mk2vsc" with this repository registered as a trusted publisher
    # (environment "pypi"). Until then this job fails harmlessly at the publish step; see issue #11.
    needs: build
    if: vars.PYPI_TRUSTED_PUBLISHING == 'true'   # set this repository variable once the PyPI project exists (issue #11)
    runs-on: ubuntu-latest
    environment: pypi
    permissions: {id-token: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
