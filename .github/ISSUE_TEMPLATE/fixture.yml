name: Fixture contribution
description: A file from hardware, firmware, or a topology we do not hold (Quattro, three-phase, .rvsc, other firmware)
labels: [fixture-wanted]
body:
  - type: input
    id: system
    attributes: {label: System, placeholder: "e.g. 2x Quattro 48/10000 three-phase, firmware 5xx, VEConfigure 90.04.xxx"}
    validations: {required: true}
  - type: textarea
    id: census
    attributes: {label: Output of `mk2vsc census`, `mk2vsc validate` and `mk2vsc info` on the file}
    validations: {required: true}
  - type: textarea
    id: tests
    attributes: {label: Which tests fail with your file added to fixtures/ (optional), description: "Copy the file under fixtures/<name>/ and run pytest; paste the failures. Failures are findings."}
  - type: checkboxes
    id: consent
    attributes:
      label: Permission
      options:
        - label: I own or am authorized to configure this system, and the file may be published in this repository under MIT
          required: true
