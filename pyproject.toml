[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rvms"
version = "0.1.0"
description = "Read, verify, edit and diff Victron VEConfigure .rvms configuration files without VEConfigure"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Kyle Hart"}]
keywords = ["victron", "veconfigure", "rvms", "rvsc", "ve.bus", "multiplus", "quattro", "ess"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
rvms = "rvms.cli:main"

[project.urls]
Homepage = "https://github.com/kylehart/rvms-toolkit"  # placeholder until the repository is created

[tool.setuptools]
packages = ["rvms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
