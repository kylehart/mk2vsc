[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mk2vsc"
version = "0.8.0"
description = "Read, verify, edit and diff Victron VEConfigure .rvms configuration files without VEConfigure"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Kyle Hart"}]
keywords = ["victron", "veconfigure", "rvms", "rvsc", "ve.bus", "multiplus", "quattro", "ess"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
mk2vsc = "mk2vsc.cli:main"

[project.urls]
Homepage = "https://kylehart.github.io/mk2vsc/"
Documentation = "https://kylehart.github.io/mk2vsc/"
Source = "https://github.com/kylehart/mk2vsc"
Changelog = "https://github.com/kylehart/mk2vsc/blob/main/CHANGELOG.md"
Issues = "https://github.com/kylehart/mk2vsc/issues"

[tool.setuptools]
packages = ["mk2vsc", "mk2vsc.experimental"]

[tool.pytest.ini_options]
testpaths = ["tests"]
